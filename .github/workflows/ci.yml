name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run verify

  ios:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Resolve Swift packages
        run: >-
          xcodebuild -resolvePackageDependencies
          -project apps/ios/ShopOverlap.xcodeproj
          -scheme ShopOverlap
      - name: Test iOS app
        run: >-
          xcodebuild test
          -project apps/ios/ShopOverlap.xcodeproj
          -scheme ShopOverlap
          -destination 'platform=iOS Simulator,OS=latest,name=iPhone 17e'
          -skipPackagePluginValidation
          CODE_SIGNING_ALLOWED=NO
